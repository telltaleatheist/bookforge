<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body { font: 13px/1.45 system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; }
      h1 { font-size: 14px; margin: 0 0 2px; }
      .status { display: flex; align-items: center; gap: 7px; margin: 6px 0 10px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa0a6; flex: none; }
      .dot.on { background: #1a9d4b; }
      .dot.warn { background: #f0a020; }
      .dot.off { background: #d23b3b; }
      .status .text { opacity: 0.85; }
      button {
        font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid #8884;
        background: #333a47; color: #f2f3f5; padding: 7px 10px;
      }
      button:hover:not(:disabled) { background: #44506a; }
      button:disabled { opacity: 0.5; cursor: default; }
      button[data-mode="loading"]:disabled { opacity: 1; }
      .spinner {
        display: inline-block; width: 11px; height: 11px; vertical-align: -1px;
        border: 2px solid #ffffff55; border-top-color: #fff; border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      button.primary { background: #4f7cff; border-color: transparent; }
      button.danger { background: #b63b3b; border-color: transparent; }
      .row { display: flex; gap: 8px; margin-bottom: 8px; }
      .row button { flex: 1; }
      .links { margin-top: 10px; font-size: 12px; opacity: 0.7; }
      .links a { color: inherit; }
      details.engine { margin: 10px 0 2px; border-top: 1px solid #8882; padding-top: 8px; }
      details.engine summary {
        cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
        opacity: 0.6; list-style: none; user-select: none;
      }
      details.engine summary::-webkit-details-marker { display: none; }
      details.engine summary::before { content: '▸ '; }
      details.engine[open] summary::before { content: '▾ '; }
      .field { margin: 10px 0 6px; }
      .field.hidden { display: none; }
      .field label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 12px; opacity: 0.85; }
      .field select, .field input[type="number"] {
        width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px;
        border: 1px solid #8884; background: #2a3140; color: #f2f3f5; font: inherit;
      }
      .wrow { display: flex; gap: 8px; align-items: center; }
      .wrow input[type="number"] { width: 70px; flex: none; }
      .wrow button { flex: 1; }
      .note { font-size: 11px; opacity: 0.6; margin-top: 5px; }
      .note.good { color: #3ec46d; opacity: 0.9; }
      .note.bad { color: #ef6b6b; opacity: 0.9; }

      /* Recorder */
      .rec { margin-top: 10px; border-top: 1px solid #8882; padding-top: 10px; }
      .rec h2 {
        font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
        opacity: 0.6; margin: 0 0 6px; font-weight: 600;
      }
      .rec .live { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
      .rec .reddot {
        width: 9px; height: 9px; border-radius: 50%; background: #d23b3b; flex: none;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.25; } }
      .rec .clock { font-variant-numeric: tabular-nums; font-weight: 600; }
      .rec .size { opacity: 0.7; }
      .meter {
        height: 6px; border-radius: 3px; background: #8883; overflow: hidden;
        margin-bottom: 8px;
      }
      .meter > span {
        display: block; height: 100%; width: 0%; background: #3ec46d;
        transition: width 0.1s linear;
      }
      .rec .path {
        font-size: 11px; opacity: 0.65; word-break: break-all; margin-top: 5px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .rec .msg { font-size: 11px; margin-top: 5px; }
      .rec .msg.bad { color: #ef6b6b; }
      .rec .msg.warn { color: #f0a020; }
      .rec .msg.good { color: #3ec46d; }
      .rec .waiting { color: #f0a020; }
      .rec .reddot.waiting { background: #f0a020; }
      .rec select.speed {
        flex: none; width: 74px; padding: 6px 6px; border-radius: 6px;
        border: 1px solid #8884; background: #2a3140; color: #f2f3f5; font: inherit;
      }
      .rec .times { opacity: 0.7; font-variant-numeric: tabular-nums; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>BookForge Reader</h1>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span class="text" id="statusText">Checking…</span>
    </div>

    <!-- Voice sits directly above the start button: starting the server loads a
         model, so you should be able to see WHICH one before you press it. -->
    <div class="field">
      <label for="voice">Voice</label>
      <select id="voice"></select>
    </div>
    <div class="row">
      <button id="server" class="primary">Start TTS server</button>
    </div>
    <!-- The engine holds several GB while warm, so it releases itself after a
         spell with nothing to do. How long that is, is the user's call. -->
    <div class="field">
      <label for="idle">Shut down after</label>
      <select id="idle"></select>
    </div>
    <div class="row">
      <button id="toggleUi">Toggle controls on this page</button>
    </div>
    <div class="row">
      <button id="playPause">Play / Pause</button>
      <button id="stopBtn">Stop ■</button>
    </div>
    <div class="note" id="nowNote"></div>

    <!-- Recorder: capture THIS tab's decoded audio, losslessly, into BookForge.
         The button lives in the popup because chrome.tabCapture.getMediaStreamId
         needs a user gesture; everything after it happens offscreen. -->
    <div class="rec" id="rec">
      <h2>Recorder</h2>
      <div class="row" id="recIdleRow">
        <button id="recStart">● Record this tab</button>
        <!-- Speed capture: the player is driven this fast with pitch preservation
             OFF, and the file is written at capture ÷ speed. Nothing resamples. -->
        <select id="recSpeed" class="speed" title="Capture speed"></select>
      </div>
      <div class="note" id="recTabTitle"></div>
      <div class="note" id="recSpeedNote"></div>

      <div id="recLiveBox" class="hidden">
        <div class="live">
          <span class="reddot" id="recDot"></span>
          <span class="clock" id="recClock">0:00:00</span>
          <span class="times" id="recTimes"></span>
          <span class="size" id="recSize"></span>
        </div>
        <div class="meter"><span id="recMeter"></span></div>
        <div class="row">
          <button id="recStop" class="primary">■ Stop</button>
          <button id="recDiscard" class="danger">✕ Discard</button>
        </div>
      </div>

      <div class="path hidden" id="recPath"></div>
      <div class="msg hidden" id="recMsg"></div>
    </div>

    <details class="engine" id="engine">
      <summary>Engine settings</summary>
      <div class="field">
        <label for="workers">CPU workers</label>
        <div class="wrow">
          <input id="workers" type="number" min="1" max="4" step="1" />
          <button id="applyEngine">Restart to apply</button>
        </div>
        <div class="note" id="engineNote"></div>
      </div>
    </details>

    <div class="links">
      <a href="#" id="openOptions">Options &amp; server settings</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
